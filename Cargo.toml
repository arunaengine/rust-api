[package]
authors = ["Sebastian <sb@pus.de>", "Marius <mariusdieckmann90@gmail.com>"]
description = "The Rust API build for the Aruna Object Storage (AOS)"
edition = "2021"
license = "Apache-2.0"
name = "aruna-rust-api"
version = "2.0.2"
include = ["src/aruna", "src/aruna_no_transport", "src/lib.rs"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prost = "0.14.1"
prost-types = "0.14.1"
prost-wkt-types = "0.6.1"
serde = {version="1.0.219", features = ["derive"]}
serde_json = "1.0.142"
tonic = {version="0.14.1", default-features = false, features=["codegen"]}

[build-dependencies]
tonic-build = "0.14.1"
tonic-prost-build = "0.14.1"

[features]
default = ["transport"]
transport = ["tonic/transport"]
